name: attach-nsis-2.0.2
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download and attach NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -L --fail -o FlashPrint-Setup-2.0.2-x64.exe "https://flashprint-nsis-202.surge.sh/FlashPrint-Setup-2.0.2-x64.exe"
          echo "ea74842bb190d6e722d40060646461c693573e536dab87692afca1a7df045da5  FlashPrint-Setup-2.0.2-x64.exe" | sha256sum -c
          gh release upload v2.0.2 FlashPrint-Setup-2.0.2-x64.exe --clobber --repo edwinsmithoc-collab/Flash-Print-Releases
