name: publicar-flashprint-2.1.0 (temporal)
on:
  push:
    paths: [".github/workflows/publicar-2.1.0.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar desde el espejo y comprobar SHA-256
        run: |
          set -e
          B=https://flashprint-acer.surge.sh
          mkdir up && cd up
          curl -fsSL $B/actualizaciones/latest.json -o m.json
          python3 - <<'PY'
          import json,urllib.request,hashlib
          m=json.load(open('m.json')); out=open(m['file'],'wb')
          for p in m['parts']:
              u='https://flashprint-acer.surge.sh/actualizaciones/'+p['urls'][0]
              for t in range(6):
                  try:
                      b=urllib.request.urlopen(u,timeout=120).read()
                      if hashlib.sha256(b).hexdigest()==p['sha256']: break
                  except Exception as e: print('reintento',u,e)
              else: raise SystemExit('parte mala '+u)
              out.write(b)
          out.close()
          PY
          for i in $(seq -w 0 13); do curl -fsSL --retry 5 $B/espejo-2.1.0/portable.parte$i.bin >> FlashPrint-Portable-2.1.0-x64.exe; done
          curl -fsSL --retry 5 $B/espejo-2.1.0/latest.yml.txt -o latest.yml
          curl -fsSL --retry 5 $B/espejo-2.1.0/FlashPrint-Setup-2.1.0-x64.exe.blockmap -o FlashPrint-Setup-2.1.0-x64.exe.blockmap
          rm m.json
          cat > SHA256SUMS.txt <<'SUMS'
          f997267e94aa0336d8605b93faa8b668863778666d4a94876ab0c6f78b613105  FlashPrint-Portable-2.1.0-x64.exe
          8423c9046b5269897db3e7520a05f8b35047201b9ec150c3bdb1d1e04c406929  FlashPrint-Setup-2.1.0-x64.exe
          55bf4fc8abaf9d65917ee99d5e430c7591970516225eb5dbd99f0c0f17a622c9  FlashPrint-Setup-2.1.0-x64.exe.blockmap
          dbcd247d028c96a92a21af2de0986a6d9b5fc6db57e9c19b3de191931b8b13d8  latest.yml
          SUMS
          sed -i 's/^ *//' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -l
      - name: Crear la release v2.1.0 y subir los archivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd up
          cat > notas.md <<'NOTAS'
          FlashPrint 2.1.0: une FlashPrint 2.0.1, 2.0.2 y «Flash Print» 1.1. Windows 7 / 8.1 / 10 / 11 de 64 bits (Electron 22).

          **Novedades**: acabados Fine Mate y Lustre con impresora por acabado · 2 fotos 7×10 en una hoja 10×15 · pasaportes y visados de 24 países · fotos desde USB / tarjeta / carpeta · carpeta vigilada · activación con clave por equipo.

          **Se mantiene**: cola siempre visible, pausar y seguir en la foto exacta (también tras reiniciar), reordenar, urgente, cancelar, 3 impresoras, packs DNI 4+1 = 7,50 € · 8 = 8,50 € · 8+2 = 9,50 €.

          **Actualización**: las 2.0.1 y 2.0.2 instaladas se actualizan solas y conservan pedidos, ajustes e historial; tienen 14 días para activar la clave.

          - `FlashPrint-Setup-2.1.0-x64.exe`: instalador (recomendado, se actualiza solo)
          - `FlashPrint-Portable-2.1.0-x64.exe`: portable, sin instalar (no se actualiza solo)
          - `latest.yml` + `.blockmap`: para la actualización automática
          NOTAS
          sed -i 's/^          //' notas.md
          if gh release view v2.1.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.1.0 FlashPrint-Setup-2.1.0-x64.exe FlashPrint-Setup-2.1.0-x64.exe.blockmap latest.yml FlashPrint-Portable-2.1.0-x64.exe SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create v2.1.0 FlashPrint-Setup-2.1.0-x64.exe FlashPrint-Setup-2.1.0-x64.exe.blockmap latest.yml FlashPrint-Portable-2.1.0-x64.exe SHA256SUMS.txt --title "FlashPrint 2.1.0" --notes-file notas.md --latest --target main -R "$GITHUB_REPOSITORY"
          fi
          gh release view v2.1.0 -R "$GITHUB_REPOSITORY"
