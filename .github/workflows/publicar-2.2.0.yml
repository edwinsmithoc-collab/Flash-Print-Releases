name: publicar-flashprint-2.2.0 (temporal)
on:
  push:
    paths: [".github/workflows/publicar-2.2.0.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar desde el espejo y comprobar SHA-256
        run: |
          set -e
          B=https://flashprint-acer.surge.sh
          mkdir up && cd up
          curl -fsSL $B/actualizaciones/latest.json -o m.json
          python3 - <<'PY'
          import json,urllib.request,hashlib
          m=json.load(open('m.json')); out=open(m['file'],'wb')
          for p in m['parts']:
              u='https://flashprint-acer.surge.sh/actualizaciones/'+p['urls'][0]
              for t in range(6):
                  try:
                      b=urllib.request.urlopen(u,timeout=120).read()
                      if hashlib.sha256(b).hexdigest()==p['sha256']: break
                  except Exception as e: print('reintento',u,e)
              else: raise SystemExit('parte mala '+u)
              out.write(b)
          out.close()
          PY
          for i in $(seq -w 0 13); do curl -fsSL --retry 5 $B/espejo-2.2.0/portable.parte$i.bin >> FlashPrint-Portable-2.2.0-x64.exe; done
          curl -fsSL --retry 5 $B/espejo-2.2.0/latest.yml.txt -o latest.yml
          curl -fsSL --retry 5 $B/espejo-2.2.0/FlashPrint-Setup-2.2.0-x64.exe.blockmap -o FlashPrint-Setup-2.2.0-x64.exe.blockmap
          rm m.json
          cat > SHA256SUMS.txt <<'SUMS'
          85d2e29de6f7dcffee7be83208e344c9cb3bdc4f98df09d68a98b232f5a2dc97  FlashPrint-Portable-2.2.0-x64.exe
          d0774fc14718c035c5a3d3d1172d67626ee96baec16d45a9f7bf74ca1ca034b5  FlashPrint-Setup-2.2.0-x64.exe
          c0cefd270757de56b6df7d1941abe2c93835eff28337f447b8d546e3ccb4c83d  FlashPrint-Setup-2.2.0-x64.exe.blockmap
          1639368af3e9e5f91c36e6bb39704b0acb2f144b93d7f43657b7045c5cbb5733  latest.yml
          SUMS
          sed -i 's/^ *//' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -l
      - name: Crear la release v2.2.0 y subir los archivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd up
          cat > notas.md <<'NOTAS'
          FlashPrint 2.2.0: módulo Foto de DNI. Windows 7 / 8.1 / 10 / 11 de 64 bits (Electron 22).

          **Novedades**: DNI, pasaporte, visado e internacional · las 3 plantillas de la tienda (4+1 = 7,50 €, DNI 8 = 8,50 €, 8+2 = 9,50 €) · galería de composiciones de PC Print en 10×15 y 15×20 · medidas oficiales por país · guía de la cara · marcas de corte · hojas a tamaño real a 300 ppp.

          **Se mantiene**: cola siempre visible, pausar y seguir en la foto exacta (también tras reiniciar), reordenar, urgente, cancelar, 3 impresoras, acabados Fine Mate y Lustre, 2×7×10, USB/carpeta, carpeta vigilada y activación con clave por equipo.

          **Actualización**: las 2.0.1 y 2.1.0 instaladas se actualizan solas y conservan pedidos, ajustes, historial y la activación. La 2.0.2 avisa de la nueva versión pero no puede bajarla sola: abre este instalador una vez.

          - `FlashPrint-Setup-2.2.0-x64.exe`: instalador (recomendado, se actualiza solo)
          - `FlashPrint-Portable-2.2.0-x64.exe`: portable, sin instalar (no se actualiza solo)
          - `latest.yml` + `.blockmap`: para la actualización automática
          NOTAS
          sed -i 's/^          //' notas.md
          if gh release view v2.2.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.2.0 FlashPrint-Setup-2.2.0-x64.exe FlashPrint-Setup-2.2.0-x64.exe.blockmap latest.yml FlashPrint-Portable-2.2.0-x64.exe SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create v2.2.0 FlashPrint-Setup-2.2.0-x64.exe FlashPrint-Setup-2.2.0-x64.exe.blockmap latest.yml FlashPrint-Portable-2.2.0-x64.exe SHA256SUMS.txt --title "FlashPrint 2.2.0" --notes-file notas.md --latest --target main -R "$GITHUB_REPOSITORY"
          fi
          gh release view v2.2.0 -R "$GITHUB_REPOSITORY"
